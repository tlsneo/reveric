name: Test macOS ARM64

# 使用 GitHub 原生分支选择器；不需要 tag，也不创建正式 Release。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 与 .fvmrc 和 build.yaml 保持一致，不使用本机 FVM。
env:
  FLUTTER_VERSION: '0b771a584214b44aa1f94f9707f2756207356f41'
  FLUTTER_CHANNEL: 'master'

jobs:
  test-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source and validate ARM64 runner
        run: |
          set -euo pipefail
          mkdir -p dist/build-logs
          {
            printf 'Run: %s (attempt %s)\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf 'Ref: %s\nCommit: %s\n' "$GITHUB_REF" "$(git rev-parse HEAD)"
            uname -m
            sw_vers
            test "$(uname -m)" = arm64
          } 2>&1 | tee dist/build-logs/environment.log

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select pinned Apple toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Record toolchain versions
        run: |
          set -euo pipefail
          {
            flutter --version
            dart --version
            rustc --version
            cargo --version
            python3 --version
            xcodebuild -version
          } 2>&1 | tee -a dist/build-logs/environment.log

      - name: Prepare packaging dependencies
        run: |
          set -euo pipefail
          {
            # 仅修改临时 runner 的工作副本，沿用现有打包流程的 SQLite 配置。
            python3 << 'PY'
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          in_hooks = False
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              for line in lines:
                  if line.startswith('hooks:'):
                      in_hooks = True
                      f.write('# ' + line)
                  elif in_hooks and line.startswith('  '):
                      f.write('# ' + line)
                  else:
                      in_hooks = False
                      f.write(line)
          PY
            rm -rf .dart_tool/hooks_runner/sqlite3
            if ! command -v pod >/dev/null 2>&1; then
              brew install cocoapods
            fi
            pod --version
            flutter pub get
          } 2>&1 | tee dist/build-logs/dependencies.log

      - name: Identify patched Codemode runtime
        id: codemode
        run: |
          set -euo pipefail
          {
            key="$(bash tools/build_codemode_runtime.sh --key)"
            printf '%s\n' "$key"
            printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee dist/build-logs/codemode-key.log
      - uses: actions/cache@v4
        with:
          path: third/fjs/darwin/fjs/Binaries
          key: ${{ steps.codemode.outputs.key }}
      - name: Build and verify patched Codemode runtime
        run: |
          set -euo pipefail
          bash tools/build_codemode_runtime.sh 2>&1 | tee dist/build-logs/native-runtime.log

      - name: Build CPU depth runtime
        run: |
          set -euo pipefail
          bash third/depth-native/prepare-product-macos.sh 2>&1 | tee dist/build-logs/depth-runtime.log

      - name: Build ARM64 Release app
        run: |
          set -euo pipefail
          {
            # 固定 Flutter 的 macOS 构建通过配置选架构，不支持 --target-platform。
            flutter config --enable-macos-arm64-only
            flutter build macos --release --verbose
          } 2>&1 | tee dist/build-logs/flutter-build.log

      - name: Verify app and create ZIP
        run: |
          set -euo pipefail
          {
            app=build/macos/Build/Products/Release/Reveric.app
            test -d "$app"
            test -f "$app/Contents/MacOS/Reveric"
            archs="$(lipo -archs "$app/Contents/MacOS/Reveric")"
            printf 'Main executable architectures: %s\n' "$archs"
            test "$archs" = arm64
            bash tools/build_codemode_runtime.sh --verify-app "$app"
            # 保留应用目录、符号链接及资源叉，避免直接上传 .app 丢失结构。
            ditto -c -k --sequesterRsrc --keepParent "$app" \
              "dist/Reveric-macos-arm64-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.zip"
          } 2>&1 | tee dist/build-logs/verify-package.log

      - name: Write download and diagnostics summary
        if: ${{ always() }}
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            printf '## macOS ARM64 自测构建\n\n'
            printf -- '- 结果：%s；运行：%s；提交：`%s`。\n' "$BUILD_STATUS" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
            cat << 'TEXT'
          - 在本次 Actions 页面底部 **Artifacts** 下载应用包；解开 artifact 后再解开其中的 `Reveric-macos-arm64-*.zip`，取得 `Reveric.app`。
          - 独立日志 artifact 中有 `environment.log`、`dependencies.log`、`native-runtime.log`、`flutter-build.log` 和核验日志；失败时也会上传已产生的文件。SDK 安装等 Action 自身失败请同时查看对应步骤日志。
          - 此包仅用于自测，未做 Developer ID 公证；macOS 可能阻止首次打开。确认来源后按系统提示使用“隐私与安全性 → 仍要打开”，不要关闭系统安全防护。
          - Release 运行日志：`~/Library/Application Support/ai.reveric/logs/latest.log`，各次启动日志为同目录 `startup_*.log`。
          - 不自动设置运行环境变量或修改产品配置；本流程不发布 tag、Release 或自动更新包。Artifacts 保留 14 天。
          TEXT
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Reveric-macos-arm64-${{ github.run_number }}-${{ github.sha }}
          path: dist/Reveric-macos-arm64-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Reveric-macos-arm64-logs-${{ github.run_number }}-${{ github.sha }}
          path: dist/build-logs/
          if-no-files-found: warn
          retention-days: 14
